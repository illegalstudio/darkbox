version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # These crates share traits and features. Updating one alone can leave two
      # versions in the graph, which silently disables the feature unification
      # that zeroizes expanded AES keys, so they move together or not at all.
      rustcrypto:
        patterns:
          - "aes"
          - "aes-gcm"
          - "sha2"
          - "ed25519-dalek"
          - "zeroize"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
